apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubernetes-front
  namespace: scheduler-demo
  labels:
    app: kubernetes-front
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kubernetes-front
  template:
    metadata:
      labels:
        app: kubernetes-front
    spec:
      containers:
        - name: web
          image: your-registry/kubernetes-front:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: kubernetes-front
  namespace: scheduler-demo
  labels:
    app: kubernetes-front
spec:
  selector:
    app: kubernetes-front
  ports:
    - name: http
      port: 80
      targetPort: 80
  type: ClusterIP
