apiVersion: v1
kind: Namespace
metadata:
  name: scheduler-demo
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: k8s-scheduler-api
  namespace: scheduler-demo
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: k8s-scheduler-api
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: k8s-scheduler-api-nodes
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: k8s-scheduler-api
subjects:
  - kind: ServiceAccount
    name: k8s-scheduler-api
    namespace: scheduler-demo
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: k8s-scheduler-api
  namespace: scheduler-demo
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: [""]
    resources: ["pods/binding"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: k8s-scheduler-api
  namespace: scheduler-demo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: k8s-scheduler-api
subjects:
  - kind: ServiceAccount
    name: k8s-scheduler-api
    namespace: scheduler-demo
